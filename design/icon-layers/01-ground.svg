<!--
  01-ground — one layer of the TorontoLiveEMS app icon.

  Assembled in Icon Composer, which ships with Xcode: File > New, drag these in bottom to
  top, and apply the glass material to the dome and the rays. The ground and the housing
  stay flat — the contrast between a flat ground and a raised light is the whole effect,
  and it is what Apple's own icons do with a map and a pin.

  Generated by scripts/make_app_icon.py. Edit that, not this.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
<defs><linearGradient id="ground" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="rgb(146,32,28)"/><stop offset="1" stop-color="rgb(52,10,12)"/></linearGradient></defs>
<rect width="1024" height="1024" fill="url(#ground)"/>
</svg>
